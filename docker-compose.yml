version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Bound to localhost only: the browser reaches the API through nginx (/api)
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_DEBUG=0
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
